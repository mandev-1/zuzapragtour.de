# Netlify config for Next.js static export
[build]
  base = "prague-tour-guide"
  publish = "out"
  command = "npm run build"

# pragkenner.de production deploy (branch name)
[context."pragkenner.de".environment]
  NEXT_PUBLIC_SITE_BRAND = "pragkenner"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[scheduled]]
  path = "/.netlify/functions/ingest"
  schedule = "*/10 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200

[[redirects]]
  from = "/llms-full.txt"
  to = "/llms-full.txt"
  status = 200

[[redirects]]
  from = "/0ba5d917a5ee483c9c875df26cd223d0.txt"
  to = "/0ba5d917a5ee483c9c875df26cd223d0.txt"
  status = 200

[[redirects]]
  from = "https://www.zuzapragtour.de/*"
  to = "https://zuzapragtour.de/:splat"
  status = 301
  force = true
