# Netlify config for Next.js static export
[build]
  base = "prague-tour-guide"
  publish = "out"
  command = "npm run build"

# pragkenner.de production deploy (branch name)
[context."pragkenner.de".environment]
  NEXT_PUBLIC_SITE_BRAND = "pragkenner"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[scheduled]]
  path = "/.netlify/functions/ingest"
  schedule = "*/10 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    # SAMEORIGIN, not DENY: /sehenswuerdigkeiten-prag embeds /maps/*.html in an iframe.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200

[[redirects]]
  from = "/llms-full.txt"
  to = "/llms-full.txt"
  status = 200

[[redirects]]
  from = "/0ba5d917a5ee483c9c875df26cd223d0.txt"
  to = "/0ba5d917a5ee483c9c875df26cd223d0.txt"
  status = 200

# Merged articles (design_handoff_blog_facelift): both winter posts → one.
# Keep in sync with `redirectFrom` in content/journal/prag-im-winter.json.
[[redirects]]
  from = "/blog/prag-winter-fotomomente"
  to = "/blog/prag-im-winter"
  status = 301
  force = true

[[redirects]]
  from = "/blog/prag-winter-geniesser"
  to = "/blog/prag-im-winter"
  status = 301
  force = true

# German-only articles keep one German URL; the old English slug 301s to it.
# Keep in sync with `redirectFrom` in content/journal/{strahov-kloster-prag,waldstein-garten-prag}.json.
[[redirects]]
  from = "/blog/strahov-monastery-prague"
  to = "/blog/strahov-kloster-prag"
  status = 301
  force = true

[[redirects]]
  from = "/blog/wallenstein-garden-prague"
  to = "/blog/waldstein-garten-prag"
  status = 301
  force = true

# Internal docs in the images folder (sources/licences) are not public.
[[redirects]]
  from = "/images/ZDROJE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/images/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.zuzapragtour.de/*"
  to = "https://zuzapragtour.de/:splat"
  status = 301
  force = true
