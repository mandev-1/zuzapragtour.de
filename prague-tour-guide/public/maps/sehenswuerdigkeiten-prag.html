<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Karte: Sehenswürdigkeiten Prag</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body,#map{margin:0;height:100%;font-family:'Hanken Grotesk',system-ui,sans-serif}
.pin{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#6B1F2A;color:#fff;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin.free{background:#11457E}
.leaflet-popup-content{font-size:14px;line-height:1.4;margin:10px 12px}
.leaflet-popup-content a{color:#11457E;font-weight:700;text-decoration:none}
.legend{background:#fff;padding:8px 10px;font-size:13px;line-height:1.6;color:#1A1714;box-shadow:0 1px 4px rgba(0,0,0,.2);border-radius:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>
<div id="map"></div>
<script>
const S = [
 [1,'Prager Burg und Veitsdom',50.0909,14.4005,1],[2,'Karlsbrücke',50.0865,14.4114,1],[3,'Altstädter Ring und Orloj',50.0873,14.4208,1],
 [4,'Josefov',50.0903,14.4180,0],[5,'Kleinseite und Kampa',50.0858,14.4075,1],[6,'Vyšehrad',50.0645,14.4180,1],
 [7,'Strahov-Kloster',50.0862,14.3893,0],[8,'Petřín',50.0835,14.3951,1],[9,'Klementinum',50.0864,14.4163,0],
 [10,'St.-Nikolaus-Kirche Kleinseite',50.0880,14.4034,0],[11,'Waldstein-Garten',50.0893,14.4057,1],[12,'Wenzelsplatz und Nationalmuseum',50.0796,14.4300,1],
 [13,'Pulverturm und Gemeindehaus',50.0871,14.4275,1],[14,'Loreto',50.0889,14.3917,0],[15,'Tanzendes Haus',50.0755,14.4142,1],
 [16,'Nationaltheater',50.0810,14.4134,0],[17,'Letná-Park',50.0960,14.4170,1],[18,'Rudolfinum',50.0899,14.4153,0],
 [19,'Agneskloster',50.0925,14.4245,0],[20,'Fernsehturm Žižkov',50.0810,14.4510,0]
];
const map = L.map('map', { scrollWheelZoom: false }).setView([50.085, 14.415], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
const pts = [];
S.forEach(([n, name, lat, lng, free]) => {
  const icon = L.divIcon({ className: '', html: '<div class="pin' + (free ? ' free' : '') + '">' + n + '</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
  L.marker([lat, lng], { icon, title: name }).addTo(map)
    .bindPopup('<b>' + n + '. ' + name + '</b><br>' + (free ? 'Kostenlos zugänglich' : 'Eintritt') + '<br><a href="#s' + n + '" target="_parent" onclick="parent.location.hash=\'s' + n + '\';return false">Zum Abschnitt</a>');
  pts.push([lat, lng]);
});
map.fitBounds(pts, { padding: [24, 24] });
const lg = L.control({ position: 'bottomleft' });
lg.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); d.innerHTML = '<div><i style="background:#11457E"></i>kostenlos</div><div><i style="background:#6B1F2A"></i>mit Eintritt</div>'; return d; };
lg.addTo(map);
</script>
</body>
</html>
