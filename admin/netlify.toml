# Netlify config for the ADMIN site → admin.zuzapragtour.de
#
# This is a SECOND Netlify site, built from the SAME repo as the public site.
# In the Netlify UI when creating it: set "Base directory" = admin
# (Netlify then runs from admin/ and reads this file; paths below are relative to admin/).

[build]
  command = "npm run build"
  publish = "dist"

# Local `netlify dev`: run Vite and proxy to it. targetPort must match
# vite.config.ts (server.port = 5174); Netlify Dev itself serves on 8888.
[dev]
  command = "npm run dev"
  targetPort = 5174
  port = 8888

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Client-side routes (admin/src/lib/route.ts) → index.html. Deliberately NO
# catch-all `/* → /index.html`: `netlify dev` applies redirects too, and a
# catch-all would swallow Vite's module requests (/src, /@vite, /node_modules)
# → blank page. Only the app's own Czech path prefixes are rewritten, so dev
# and production both work. Add a prefix here when adding a route.
[[redirects]]
  from = "/analytika"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/analytika/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/poptavky"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/poptavky/*"
  to = "/index.html"
