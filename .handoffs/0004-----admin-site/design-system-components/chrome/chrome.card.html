<!-- @dsCard group="Components" viewport="820x680" name="Chrome — Header & Footer" subtitle="Sticky site nav (transparent → glassy) and the dark ink footer" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--canvas-alt); font-family: var(--font-sans); color: var(--ink); }
  .lab { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-mute); margin: 0; padding: 14px 24px 10px; }
  .frame { position: relative; overflow: hidden; }
  /* a faux hero strip so the transparent header reads like it does on the live home page */
  .hero { position: relative; height: 150px; background:
      linear-gradient(90deg, rgba(26,23,20,.72), rgba(26,23,20,.15)),
      linear-gradient(135deg, #4a3b2e, #6b1f2a 80%); }
  .hero .cap { position: absolute; left: 24px; bottom: 16px; font-family: var(--font-display); font-size: 26px; color: var(--ivory); }
  .hero .cap em { font-family: var(--font-italic); font-style: italic; color: var(--gold-lamp); }
  .lightstrip { height: 92px; background: var(--canvas); border-bottom: 1px solid var(--rule); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { SiteHeader, SiteFooter } = window.ZuzaPragueToursDesignSystem_748186;
    // Header is position:fixed in the wild — pin it statically inside each demo frame.
    const stat = { position: 'static' };
    function App() {
      return (
        <>
          <p className="lab" style={{ paddingTop: 18 }}>Header · over a hero (transparent)</p>
          <div className="frame">
            <div className="hero">
              <SiteHeader style={stat} solidOnScroll current="" />
              <div className="cap">Prag, erzählt mit <em>Leidenschaft</em></div>
            </div>
          </div>
          <p className="lab">Header · inner page (solid / glassy)</p>
          <div className="frame">
            <SiteHeader style={stat} current="tours" />
            <div className="lightstrip"></div>
          </div>
          <p className="lab">Footer</p>
          <SiteFooter />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
