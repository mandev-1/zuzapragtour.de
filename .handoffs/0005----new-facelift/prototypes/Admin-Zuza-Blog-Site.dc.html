<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/zuza-prague-tours-design-system-748186f1-ed2e-4022-8b40-511f8b3c1bce/tokens/fonts.css">
<link rel="stylesheet" href="_ds/zuza-prague-tours-design-system-748186f1-ed2e-4022-8b40-511f8b3c1bce/tokens/colors.css">
<link rel="stylesheet" href="_ds/zuza-prague-tours-design-system-748186f1-ed2e-4022-8b40-511f8b3c1bce/tokens/typography.css">
<link rel="stylesheet" href="_ds/zuza-prague-tours-design-system-748186f1-ed2e-4022-8b40-511f8b3c1bce/tokens/spacing.css">
<link rel="stylesheet" href="_ds/zuza-prague-tours-design-system-748186f1-ed2e-4022-8b40-511f8b3c1bce/styles.css">
<script src="admin-bundle.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  @keyframes zadmin-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</helmet>

<sc-if value="{{ notAuthed }}" hint-placeholder-val="{{ true }}">
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow:auto">
  <div style="position:absolute;inset:0;z-index:0"><img src="assets/images/night-prague.jpg" alt="" style="width:100%;height:100%;object-fit:cover"></div>
  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(135deg, rgba(20,16,12,0.82), rgba(79,22,32,0.86))"></div>
  <form onSubmit="{{ login }}" style="position:relative;z-index:2;width:100%;max-width:420px;background:var(--paper);border-radius:var(--radius-2xl);box-shadow:0 30px 70px rgba(20,16,12,0.45);padding:clamp(2rem,4vw,2.8rem)">
    <div style="font-family:var(--font-display);font-size:1.25rem;letter-spacing:0.02em;color:var(--ink)">Zuza <b style="font-weight:400">&amp;</b> Pragtour</div>
    <div style="height:1px;background:var(--rule);margin:1.2rem 0 1.6rem"></div>
    <span style="display:inline-flex;align-items:center;gap:0.7rem;font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.24em;text-transform:uppercase;color:var(--brass-deep)"><span style="width:22px;height:1px;background:var(--brass)"></span>Redaktion · Interner Bereich</span>
    <h1 style="margin:0.7rem 0 0.5rem;font-family:var(--font-display);font-weight:400;font-size:clamp(1.9rem,4vw,2.5rem);line-height:1.08;letter-spacing:-0.01em;color:var(--ink)">Journal-Verwaltung</h1>
    <p style="margin:0 0 1.7rem;font-family:var(--font-body);font-size:1rem;line-height:1.6;color:var(--ink-mute)">Melden Sie sich an, um Artikel zu schreiben, zu bearbeiten und zu veröffentlichen.</p>
    <div style="display:grid;gap:1.1rem">
      <x-import component-from-global-scope="ZuzaPragueToursDesignSystem_748186.Field" label="E-Mail" name="email" type="email" placeholder="zuzana@zuzapragtour.de" hint-size="100%,68px"></x-import>
      <x-import component-from-global-scope="ZuzaPragueToursDesignSystem_748186.Field" label="Passwort" name="password" type="password" placeholder="••••••••" hint-size="100%,68px"></x-import>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:0.1rem">
        <label style="display:inline-flex;align-items:center;gap:0.5rem;font-family:var(--font-sans);font-size:12px;color:var(--ink-soft);cursor:pointer"><input type="checkbox" checked="{{ true }}" style="accent-color:var(--burgundy);width:15px;height:15px">Angemeldet bleiben</label>
        <a href="#" onClick="{{ login }}" style="font-family:var(--font-sans);font-size:12px;color:var(--burgundy);text-decoration:none">Passwort vergessen?</a>
      </div>
      <div style="margin-top:0.5rem">
        <x-import component-from-global-scope="ZuzaPragueToursDesignSystem_748186.Button" variant="primary" type="submit" icon="arrow_forward" full-width="{{ true }}" onClick="{{ login }}" hint-size="100%,46px">Anmelden</x-import>
      </div>
    </div>
    <div style="height:1px;background:var(--rule);margin:1.6rem 0 1.1rem"></div>
    <p style="margin:0;display:flex;align-items:center;gap:0.5rem;font-family:var(--font-sans);font-size:11px;letter-spacing:0.02em;color:var(--ink-mute)"><span class="material-symbols-outlined" style="font-size:15px;color:var(--brass-deep)">lock</span>Geschützter Bereich · Nur für autorisierte Redakteure</p>
  </div>
</form>
</div>
</sc-if>

<sc-if value="{{ authed }}">
<div style="position:fixed;inset:0;background:var(--canvas)">
  <x-import component-from-global-scope="ZuzaPragueToursDesignSystem_748186.AdminSuite" image-base="assets/images/" hint-size="100%,100%"></x-import>
  <button type="button" onClick="{{ logout }}" title="Abmelden" style="position:fixed;bottom:16px;right:16px;z-index:40;display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.04em;color:var(--ink-soft);background:#fff;border:1px solid var(--rule);border-radius:var(--radius-pill);padding:0.5rem 0.85rem;cursor:pointer" style-hover="border-color:var(--ink);color:var(--ink)"><span class="material-symbols-outlined" style="font-size:15px">logout</span>Abmelden</button>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { authed: false };

  login = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    this.setState({ authed: true });
  };
  logout = () => this.setState({ authed: false });

  renderVals() {
    return {
      authed: this.state.authed,
      notAuthed: !this.state.authed,
      login: this.login,
      logout: this.logout
    };
  }
}
</script>
</body>
</html>
