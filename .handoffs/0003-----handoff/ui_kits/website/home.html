<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuzana Manová | Deutschsprachige Prag-Expertin & Stadtführerin</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); }
  a { color: inherit; }
  img { display: block; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="site-home.jsx"></script>
  <script type="text/babel" data-presets="react">
    // Standalone "/" page — mounts Header + Home + Footer.
    // Nav/CTA links open the full interactive kit (index.html) on the Book/Tours screens.
    const { Header: SiteHeader, Footer: SiteFooter, Home: SiteHome } = window.ZPTSite;
    const go = (screen) => {
      if (screen === 'home') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      window.location.href = 'index.html';
    };
    function HomePage() {
      return (
        <div>
          <SiteHeader screen="home" go={go} />
          <SiteHome go={go} />
          <SiteFooter go={go} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<HomePage />);
  </script>
</body>
</html>
